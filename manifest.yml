display_information:
  name: Big Emoji
  description: Post custom emoji as big images under your own name
features:
  bot_user:
    display_name: big-emoji
    always_online: false
  slash_commands:
    - command: /big
      description: Post a custom emoji as a big image
      usage_hint: ":party_parrot:"
      should_escape: false
oauth_config:
  redirect_urls:
    - https://YOUR-PUBLIC-HOST/slack/oauth/callback
  scopes:
    bot:
      - commands
      - emoji:read
    user:
      - chat:write
settings:
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
