display_information:
  name: 큰 이모지
  description: 커스텀 이모지를 본인 이름으로 크게 올립니다
features:
  bot_user:
    display_name: big-emoji
    always_online: false
  slash_commands:
    - command: /big
      description: 커스텀 이모지를 크게 올립니다
      usage_hint: ":party_parrot:"
      should_escape: false
oauth_config:
  redirect_urls:
    - https://YOUR-PUBLIC-HOST/slack/oauth/callback
  scopes:
    bot:
      - commands
      - emoji:read
    user:
      - chat:write
settings:
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
